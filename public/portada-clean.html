<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AprenderIA & EducarIA — Portada Oficial Minimalista (MINICLUB)</title>

  <!-- Google Fonts for Modern Minimalist Aesthetic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* --------------------------------------------------------------------------
       PRISTINE WHITE MINIMALIST MODERN FUTURISTIC TOKENS
       -------------------------------------------------------------------------- */
    :root {
      --mondrian-red: #E52521;
      --mondrian-blue: #004586;
      --mondrian-yellow: #F7D000;
      --font-body: 'Fredoka', 'Nunito', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      min-height: 100dvh;
      background: #FFFFFF;
      color: #0F172A;
      font-family: var(--font-body);
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 90;
    }

    /* Top Accent Stripe */
    .top-accent-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--mondrian-blue) 0%, var(--mondrian-blue) 45%, var(--mondrian-red) 45%, var(--mondrian-red) 75%, var(--mondrian-yellow) 75%, var(--mondrian-yellow) 100%);
      z-index: 100;
    }

    /* --------------------------------------------------------------------------
       MAIN STAGE CONTAINER (CENTERED CHANCAY & SHOULDER LOGOS)
       -------------------------------------------------------------------------- */
    .cover-main-stage {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      box-sizing: border-box;
      text-align: center;
    }

    /* Top National MINEDU Pill Tagline */
    .minedu-tag-pill {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      padding: 8px 26px;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 800;
      color: #334155;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 30px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    /* --------------------------------------------------------------------------
       HERO STAGE: CHANCAY LARGER IN CENTER & LOGOS CLOSER AT SHOULDERS
       -------------------------------------------------------------------------- */
    .hero-shoulder-composition {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(10px, 2vw, 25px); /* Logos closer to Chancay */
      max-width: 1280px;
      width: 100%;
      margin-bottom: 24px;
    }

    /* Left & Right Raw Logo Wrapper (Positioned at shoulder height & closer) */
    .shoulder-logo-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 10px; /* Positioned at shoulder height */
    }

    .raw-logo-img {
      width: 100%;
      max-width: 380px; /* Slightly larger logos */
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 12px 28px rgba(0, 69, 134, 0.12));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .raw-logo-img:hover {
      transform: scale(1.05);
    }

    .logo-subtitle-tag {
      font-size: 0.8rem;
      font-weight: 800;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 8px;
    }

    /* Center: Chancay Default Hero Mascot (Larger) */
    .chancay-center-hero {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .chancay-default-img {
      width: clamp(260px, 32vw, 400px); /* Larger Chancay mascot */
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 22px 45px rgba(0, 0, 0, 0.18));
      animation: chancayFloatSubtle 4.2s ease-in-out infinite alternate;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .chancay-default-img:hover {
      transform: scale(1.05) rotate(1.5deg);
    }

    @keyframes chancayFloatSubtle {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    /* Minimalist Speech Bubble Capsule with Tail Pointer */
    .speech-bubble-clean {
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
      box-shadow: 0 12px 32px rgba(0, 69, 134, 0.08);
      border-radius: 22px;
      padding: 14px 28px;
      max-width: 360px;
      margin-top: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #0F172A;
      line-height: 1.45;
      position: relative;
      text-align: center;
    }

    /* Speech Bubble Tail Arrow pointing UP towards Chancay */
    .speech-bubble-clean::before {
      content: '';
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      border-right: 12px solid transparent;
      border-left: 12px solid transparent;
      border-bottom: 14px solid #E2E8F0;
    }

    .speech-bubble-clean::after {
      content: '';
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-right: 10px solid transparent;
      border-left: 10px solid transparent;
      border-bottom: 12px solid #FFFFFF;
    }

    /* --------------------------------------------------------------------------
       MODERN FUTURISTIC MINIMALIST INTIS REWARD BUTTON
       -------------------------------------------------------------------------- */
    .intis-action-btn-futuristic {
      background: linear-gradient(135deg, #F7D000 0%, #FFB300 100%);
      color: #0F172A;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 30px rgba(247, 208, 0, 0.38), 0 4px 12px rgba(0, 0, 0, 0.06);
      font-family: var(--font-body);
      font-weight: 800;
      font-size: 1.1rem;
      padding: 16px 42px;
      border-radius: 100px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 18px;
    }

    .intis-action-btn-futuristic:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 16px 40px rgba(247, 208, 0, 0.55), 0 6px 16px rgba(0, 0, 0, 0.1);
      background: linear-gradient(135deg, #FFE082 0%, #FFC107 100%);
    }

    .intis-action-btn-futuristic:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 4px 14px rgba(247, 208, 0, 0.3);
    }

    /* Clean Video Recording Mode Hint */
    .clean-hint-text {
      font-size: 0.78rem;
      color: #94A3B8;
      font-weight: 700;
      margin-top: 22px;
      transition: opacity 0.3s;
    }

    .clean-hint-text.hidden-ui {
      opacity: 0;
      pointer-events: none;
    }

    /* Responsive Adaptation for Mobile/Tablet */
    @media (max-width: 900px) {
      .hero-shoulder-composition {
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      .shoulder-logo-side {
        margin-top: 0;
      }
      .raw-logo-img {
        max-width: 290px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Accent Stripe -->
  <div class="top-accent-bar"></div>

  <!-- Confetti Burst Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- MAIN COVER STAGE -->
  <main class="cover-main-stage">

    <!-- Top National MINEDU Tag -->
    <div class="minedu-tag-pill">
      <span>🇵🇪 MINEDU PERÚ</span>
      <span>•</span>
      <span style="color: var(--mondrian-blue);">HACKATHON 2026 - MINICLUB</span>
    </div>

    <!-- HERO COMPOSITION: CHANCAY LARGER IN CENTER & LOGOS CLOSER AT SHOULDERS -->
    <div class="hero-shoulder-composition">

      <!-- LEFT SHOULDER: LOGO APRENDERIA -->
      <div class="shoulder-logo-side">
        <img src="/portada-mondrian/LOGO APRENDERIA.png" alt="Logo AprenderIA" class="raw-logo-img">
        <div class="logo-subtitle-tag">🎓 Módulo Estudiante</div>
      </div>

      <!-- CENTER: CHANCAY DEFAULT MASCOT (LARGER) -->
      <div class="chancay-center-hero">
        <img src="/images/chancay/chancay-default.png" alt="Chancay Mascot Default" class="chancay-default-img" onclick="launchConfettiIntis()">
        
        <!-- Speech Bubble with Tail Arrow Pointer -->
        <div class="speech-bubble-clean">
          ¡Hola! 🐹🇵🇪 Soy Chancay, tu tutor virtual de la maleta tecnológica.
        </div>
      </div>

      <!-- RIGHT SHOULDER: LOGO EDUCARIA -->
      <div class="shoulder-logo-side">
        <img src="/portada-mondrian/LOGO EDUCARIA.png" alt="Logo EducarIA" class="raw-logo-img">
        <div class="logo-subtitle-tag">💼 Módulo Docente</div>
      </div>

    </div>

    <!-- PROMINENT MODERN FUTURISTIC INTIS REWARD BUTTON -->
    <button class="intis-action-btn-futuristic" onclick="launchConfettiIntis()" id="intis-btn">
      🪙 ¡LANZAR INTIS DE LA VICTORIA! 💥
    </button>

    <!-- Clean Video Recording Hint -->
    <div class="clean-hint-text" id="clean-hint">
      🎥 Presiona la tecla <strong>H</strong> para ocultar/mostrar la interfaz durante la grabación del trailer.
    </div>

  </main>

  <!-- JAVASCRIPT ANIMATIONS & CONFETTI ENGINE -->
  <script>
    // --------------------------------------------------------------------------
    // CONFETTI INTIS COIN BURST SYSTEM
    // --------------------------------------------------------------------------
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiItems = [];

    function resizeConfettiCanvas() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfettiCanvas);
    resizeConfettiCanvas();

    function launchConfettiIntis() {
      const audio = new Audio('/chancay/audio/felicitaciones.mp3');
      audio.play().catch(e => console.log('Audio info:', e));

      for (let i = 0; i < 70; i++) {
        confettiItems.push({
          x: window.innerWidth / 2 + (Math.random() - 0.5) * 280,
          y: window.innerHeight / 2 + 20,
          vx: (Math.random() - 0.5) * 16,
          vy: Math.random() * -15 - 5,
          gravity: 0.38,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.25,
          size: Math.random() * 16 + 22,
          symbol: Math.random() > 0.3 ? '🪙' : '✨',
          alpha: 1.0
        });
      }
    }

    function renderConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      for (let i = confettiItems.length - 1; i >= 0; i--) {
        let c = confettiItems[i];
        c.x += c.vx;
        c.y += c.vy;
        c.vy += c.gravity;
        c.rot += c.vRot;
        c.alpha -= 0.012;

        if (c.alpha <= 0 || c.y > confettiCanvas.height + 50) {
          confettiItems.splice(i, 1);
          continue;
        }

        confettiCtx.save();
        confettiCtx.translate(c.x, c.y);
        confettiCtx.rotate(c.rot);
        confettiCtx.globalAlpha = c.alpha;
        confettiCtx.font = `${c.size}px sans-serif`;
        confettiCtx.textAlign = 'center';
        confettiCtx.textBaseline = 'middle';
        confettiCtx.fillText(c.symbol, 0, 0);
        confettiCtx.restore();
      }

      requestAnimationFrame(renderConfetti);
    }
    renderConfetti();

    // --------------------------------------------------------------------------
    // CLEAN VIDEO RECORDING MODE TOGGLE (KEY H)
    // --------------------------------------------------------------------------
    let isCleanMode = false;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') {
        isCleanMode = !isCleanMode;
        const hint = document.getElementById('clean-hint');
        const btn = document.getElementById('intis-btn');

        if (isCleanMode) {
          if (hint) hint.classList.add('hidden-ui');
          if (btn) btn.style.opacity = '0';
        } else {
          if (hint) hint.classList.remove('hidden-ui');
          if (btn) btn.style.opacity = '1';
        }
      }
    });
  </script>

</body>
</html>
